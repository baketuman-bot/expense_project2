# /etc/apache2/sites-available/expense_project2.conf
# Copy this file to the above path and enable it with:
#   sudo a2ensite expense_project2.conf && sudo a2enmod wsgi && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName 172.16.100.150
    ServerAdmin webmaster@localhost

    # WSGI (daemon mode)
    WSGIDaemonProcess expense_project2 \
        python-home=/home/idc_user/expense_project2/.venv \
        python-path=/home/idc_user/expense_project2
    WSGIProcessGroup expense_project2
    WSGIScriptAlias / /home/idc_user/expense_project2/expense_project/wsgi.py

    <Directory /home/idc_user/expense_project2/expense_project>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Static & Media
    Alias /static/ /home/idc_user/expense_project2/static/
    <Directory /home/idc_user/expense_project2/static/>
        Require all granted
    </Directory>

    Alias /media/ /home/idc_user/expense_project2/media/
    <Directory /home/idc_user/expense_project2/media/>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/expense_project2_error.log
    CustomLog ${APACHE_LOG_DIR}/expense_project2_access.log combined
</VirtualHost>
