# Windows Apache24 reverse-proxy vhost for WSL/Linux Django
# Place this file at:
#   C:\Apache24\conf\extra\expense_project2-proxy-windows.conf
# Then include it from C:\Apache24\conf\httpd.conf (see httpd.conf-windows-snippet.txt).
#
# Backend (WSL) must be listening on port 8000.
# If Windows can reach WSL via localhost forwarding, you can use 127.0.0.1:8000.
# If that does not work in your environment, use the WSL IP address instead.
# Example (WSL):
#   export DEBUG=0
#   export SERVE_MEDIA=1
#   /home/idc_user/expense_project2/.venv/bin/gunicorn expense_project.wsgi:application --bind 0.0.0.0:8000

<VirtualHost *:80>
    ServerName 172.16.100.150

    ProxyPreserveHost On

    # Tell Django the original scheme/host (useful when you later add HTTPS)
    RequestHeader set X-Forwarded-Proto "http"

    # Proxy everything to WSL backend
    # Option 1: localhost forwarding works (preferred when available)
    ProxyPass        / http://127.0.0.1:8000/ retry=0
    ProxyPassReverse / http://127.0.0.1:8000/

    # Option 2: use WSL IP directly (uncomment and replace <WSL_IP>)
    # ProxyPass        / http://<WSL_IP>:8000/ retry=0
    # ProxyPassReverse / http://<WSL_IP>:8000/

    ErrorLog  "logs/expense_project2_error.log"
    CustomLog "logs/expense_project2_access.log" combined
</VirtualHost>
