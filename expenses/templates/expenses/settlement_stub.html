{% extends "expenses/base.html" %}

{% block content %}
<div class="mt-4" style="max-width:860px;">

  <div class="page-head mb-4">
    <h2 class="page-title mb-0">
      <span class="pt-ico"><i class="fas {{ icon }}"></i></span>
      {{ title }}
    </h2>
    <div class="page-actions">
      <a href="{% url 'expenses:settlement_menu' %}" class="btn btn-sm btn-outline-secondary">
        <i class="fas fa-arrow-left me-1"></i>精算処理メニューへ
      </a>
    </div>
  </div>

  <div class="card">
    <div class="card-body text-center text-muted py-5">
      <i class="fas {{ icon }} fa-2x mb-3 d-block" style="color:var(--primary);"></i>
      <p class="mb-0">{{ title }}の機能は現在準備中です。</p>
    </div>
  </div>

</div>
{% endblock %}
